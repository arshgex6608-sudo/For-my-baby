<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Babyyyy ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e7,#fff2f8);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
background:white;
padding:40px;
width:90%;
max-width:600px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.15);
text-align:center;
animation:fade 1.2s ease;
}

h1{
color:#ff4f8b;
font-size:45px;
margin-bottom:15px;
}

h2{
color:#ff7aa8;
margin-bottom:25px;
font-weight:normal;
}

p{
font-size:20px;
line-height:1.8;
color:#555;
}
    button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:50px;
background:#ff4f8b;
color:white;
font-size:20px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="card">

<h1>To My Babyyyy ❤️</h1>

<h2>You make my world brighter ✨</h2>

<p>

Baby,

<br><br>

I made this little place just for you.

<br><br>

Thank you for choosing me every day.

<br><br>

I am all yours. ❤️

<br><br>

I love you soooo much.

<br><br>

Muaahhhhhhhhh 💋

</p>
<button>Open My Heart ❤️</button>

</div>

</body>

</html>
